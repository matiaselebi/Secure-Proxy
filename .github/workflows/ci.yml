name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    # Sin techo, un test que se cuelga deja el job corriendo horas. Los 316
    # tardan menos de dos minutos, así que diez es holgado y a la vez avisa
    # rápido si algo se traba.
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Las dos versiones que importan: la de Debian estable y la actual.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q

      # Que pasen los tests no garantiza que el proxy ARRANQUE. Un import mal
      # puesto o un error al leer la configuración no siempre lo agarra un
      # test unitario, y es justo lo que rompe la instalación de alguien que
      # clona el repo.
      - name: Comprobar que arranca, responde y apaga limpio
        run: |
          # ---- set -m: sin esto el apagado por SIGINT no se puede probar ----
          #
          # Bash, cuando NO es interactivo y no tiene control de trabajos, le
          # deja el SIGINT en SIG_IGN a todo lo que se lanza con "&". O sea:
          # en un runner, `kill -INT $PID` sobre el proxy no hace absolutamente
          # nada, el proceso sigue vivo y el `wait` de abajo se cuelga para
          # siempre. A mano no se ve nunca, porque una terminal interactiva sí
          # tiene control de trabajos y ahí el SIGINT llega bien.
          #
          # `set -m` lo prende, cada proceso de fondo queda en su propio grupo
          # y con los handlers por defecto, que es justo lo que hace falta para
          # que esta prueba pruebe algo.
          set -m

          python - <<'EOF'
          import pathlib
          p = pathlib.Path('config/config.yaml')
          t = p.read_text(encoding='utf-8')
          p.write_text(t.replace('port: 8888', 'port: 18888')
                        .replace('dashboard_port: 8889', 'dashboard_port: 18889'),
                       encoding='utf-8')
          EOF

          # Lo que imprime el proxy va a un archivo, no al vacío: si algo sale
          # mal, "el panel nunca respondió" no dice nada y el log sí. Un CI que
          # falla sin mostrar el motivo obliga a adivinar.
          arrancar() {
            python -u scripts/run_proxy.py > /tmp/proxy.log 2>&1 &
            PROXY_PID=$!
            for _ in $(seq 1 30); do
              curl -sf http://127.0.0.1:18889/health > /dev/null && return 0
              # Si el proceso ya murió no tiene sentido seguir esperando.
              kill -0 $PROXY_PID 2>/dev/null || break
              sleep 1
            done
            echo "::error::el proxy no respondió en /health. Esto imprimió:"
            cat /tmp/proxy.log
            return 1
          }

          arrancar
          curl -sf -o /dev/null -w "panel: HTTP %{http_code}\n" http://127.0.0.1:18889/

          # SIGINT es la señal que usa el servicio de systemd, justamente
          # porque con SIGTERM el apagado deja basura.
          kill -INT $PROXY_PID
          # Con techo: si el apagado se cuelga, mejor fallar en 30 segundos con
          # el log a la vista que consumir los 10 minutos del job.
          for _ in $(seq 1 30); do
            kill -0 $PROXY_PID 2>/dev/null || break
            sleep 1
          done
          if kill -0 $PROXY_PID 2>/dev/null; then
            echo "::error::el proxy sobrevivió al SIGINT"
            cat /tmp/proxy.log
            kill -9 $PROXY_PID
            exit 1
          fi
          wait $PROXY_PID && echo "apagó con código 0"
          test ! -f data/proxy.pid || { echo "quedó el PID file huérfano"; exit 1; }

          # Y lo mismo, pero apagándolo desde el botón del panel. Los tests
          # verifican la ruta contra un apagado de mentira; esto verifica que
          # el proceso de verdad se muera y limpie igual que con Ctrl+C.
          arrancar
          curl -sf http://127.0.0.1:18889/apagar | grep -q "SecureProxy apagado" \
            || { echo "::error::/apagar no devolvió la página de despedida"; cat /tmp/proxy.log; exit 1; }
          wait $PROXY_PID && echo "el botón de apagar cerró con código 0"
          test ! -f data/proxy.pid || { echo "el botón dejó el PID file huérfano"; exit 1; }

          git checkout config/config.yaml

      - name: Comprobar que el servicio de systemd es válido
        run: |
          test -f deploy/secureproxy.service \
            || { echo "falta deploy/secureproxy.service"; exit 1; }

          salida=$(systemd-analyze verify deploy/secureproxy.service 2>&1 || true)
          echo "$salida"

          # Solo importan las líneas que hablan de NUESTRA unidad.
          #
          # systemd-analyze mezcla en la misma salida cosas del entorno donde
          # corre, que no tienen nada que ver con el archivo. En los runners de
          # GitHub aparece "Binding to IPv6 address not available since kernel
          # does not support IPv6", y como antes acá se filtraba por el texto
          # de un mensaje puntual ("is not executable") en vez de por a quién
          # se refiere, ese aviso hacía fallar el CI entero con la unidad
          # perfectamente bien. Filtrando por el nombre de la unidad, cualquier
          # ruido futuro del entorno tampoco va a molestar.
          #
          # La excepción es "is not executable": el ExecStart apunta al python
          # del venv del servidor, que en el runner no existe. Ahí el que está
          # mal es el runner, no el archivo.
          problemas=$(echo "$salida" | grep "secureproxy\.service" \
                      | grep -v "is not executable" || true)
          if [ -n "$problemas" ]; then
            echo "----"
            echo "problemas en la unidad:"
            echo "$problemas"
            exit 1
          fi
          echo "unidad de systemd válida"

  # ---------------------------------------------------------------- Windows
  #
  # Un job APARTE y no una matriz sobre el job de Linux, a propósito. El de
  # Linux tiene pasos escritos en bash (prender el servicio, pegarle, apagarlo)
  # que en un runner de Windows no corren. Meterlos en una matriz obligaría a
  # llenarlos de condicionales; así, cada job hace lo que sabe hacer.
  #
  # Windows corre los tests unitarios y nada más. Alcanza para lo que este job
  # viene a cuidar: que arreglar algo de Linux no rompa Windows sin que nadie
  # se entere hasta prender la suite en la PC.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -q
