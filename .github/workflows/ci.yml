name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    # Sin techo, un test que se cuelga deja el job corriendo horas. Los 316
    # tardan menos de dos minutos, así que diez es holgado y a la vez avisa
    # rápido si algo se traba.
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Las dos versiones que importan: la de Debian estable y la actual.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q

      # Que pasen los tests no garantiza que el proxy ARRANQUE. Un import mal
      # puesto o un error al leer la configuración no siempre lo agarra un
      # test unitario, y es justo lo que rompe la instalación de alguien que
      # clona el repo.
      - name: Comprobar que arranca, responde y apaga limpio
        run: |
          python - <<'EOF'
          import pathlib
          p = pathlib.Path('config/config.yaml')
          t = p.read_text(encoding='utf-8')
          p.write_text(t.replace('port: 8888', 'port: 18888')
                        .replace('dashboard_port: 8889', 'dashboard_port: 18889'),
                       encoding='utf-8')
          EOF
          python -u scripts/run_proxy.py &
          PROXY_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:18889/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18889/health || { echo "el panel nunca respondió"; exit 1; }
          curl -sf -o /dev/null -w "panel: HTTP %{http_code}\n" http://127.0.0.1:18889/
          # SIGINT es la señal que usa el servicio de systemd, justamente
          # porque con SIGTERM el apagado deja basura.
          kill -INT $PROXY_PID
          wait $PROXY_PID && echo "apagó con código 0"
          test ! -f data/proxy.pid || { echo "quedó el PID file huérfano"; exit 1; }

          # Y lo mismo, pero apagándolo desde el botón del panel. Los tests
          # verifican la ruta contra un apagado de mentira; esto verifica que
          # el proceso de verdad se muera y limpie igual que con Ctrl+C.
          python -u scripts/run_proxy.py &
          PROXY_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:18889/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18889/apagar | grep -q "SecureProxy apagado" \
            || { echo "/apagar no devolvió la página de despedida"; exit 1; }
          wait $PROXY_PID && echo "el botón de apagar cerró con código 0"
          test ! -f data/proxy.pid || { echo "el botón dejó el PID file huérfano"; exit 1; }

          git checkout config/config.yaml

      - name: Comprobar que el servicio de systemd es válido
        run: |
          test -f deploy/secureproxy.service \
            || { echo "falta deploy/secureproxy.service"; exit 1; }

          salida=$(systemd-analyze verify deploy/secureproxy.service 2>&1 || true)
          echo "$salida"

          # Solo importan las líneas que hablan de NUESTRA unidad.
          #
          # systemd-analyze mezcla en la misma salida cosas del entorno donde
          # corre, que no tienen nada que ver con el archivo. En los runners de
          # GitHub aparece "Binding to IPv6 address not available since kernel
          # does not support IPv6", y como antes acá se filtraba por el texto
          # de un mensaje puntual ("is not executable") en vez de por a quién
          # se refiere, ese aviso hacía fallar el CI entero con la unidad
          # perfectamente bien. Filtrando por el nombre de la unidad, cualquier
          # ruido futuro del entorno tampoco va a molestar.
          #
          # La excepción es "is not executable": el ExecStart apunta al python
          # del venv del servidor, que en el runner no existe. Ahí el que está
          # mal es el runner, no el archivo.
          problemas=$(echo "$salida" | grep "secureproxy\.service" \
                      | grep -v "is not executable" || true)
          if [ -n "$problemas" ]; then
            echo "----"
            echo "problemas en la unidad:"
            echo "$problemas"
            exit 1
          fi
          echo "unidad de systemd válida"
